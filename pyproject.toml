# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-epistemic"
dynamic = ["version"]
description = "Epistemic language plane: a know/believe operator over a proposition, held by an agent at a certainty band, as an nD facet over loomground-factual."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# Consumes the assertoric substrate (loomground-factual); the epistemic modality
# is a facet OVER facts. factual is 0.1.x — the substrate's stable line.
dependencies = ["loomground-factual>=0.1,<0.2"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "loomground_epistemic._version.__version__" }

[tool.setuptools.package-data]
loomground_epistemic = ["artifacts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
